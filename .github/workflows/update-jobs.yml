name: Update job postings

on:
  schedule:
    - cron: '17 11 * * *'   # daily, ~6:17am ET
  workflow_dispatch: {}      # manual "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node fetch-jobs.mjs
      - name: Commit if changed
        run: |
          if ! git diff --quiet united-jobs.json; then
            git config user.name "jobs-bot"
            git config user.email "actions@users.noreply.github.com"
            git add united-jobs.json
            git commit -m "Update job postings"
            git push
          else
            echo "No changes."
          fi
